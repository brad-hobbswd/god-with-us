<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Page Not Found | Overshadowed
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--bg:#090909;
--panel:#141414;
--gold:#c59b54;
--gold-light:#f2d7a1;
--cream:#fff5dc;
--text:#e6dcc8;

}

body{

background:linear-gradient(
180deg,
#090909,
#141414
);

font-family:Georgia,serif;

color:var(--cream);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}

.container{

max-width:800px;

width:100%;

text-align:center;

background:rgba(20,20,20,.95);

padding:70px 50px;

border-radius:25px;

border:
1px solid rgba(197,155,84,.18);

box-shadow:
0 0 60px rgba(0,0,0,.7);

}

.code{

font-size:7rem;

font-weight:bold;

color:var(--gold);

line-height:1;

text-shadow:
0 0 25px rgba(197,155,84,.35);

margin-bottom:15px;

}

h1{

font-size:2.5rem;

margin-bottom:25px;

color:var(--gold-light);

}

p{

font-size:1.08rem;

line-height:1.9;

color:var(--text);

margin-bottom:35px;

}

.quote{

margin:40px 0;

padding-left:20px;

border-left:
3px solid var(--gold);

text-align:left;

font-style:italic;

color:var(--gold-light);

}

.button{

display:inline-block;

padding:15px 35px;

border-radius:40px;

background:var(--gold);

color:black;

font-weight:bold;

text-decoration:none;

transition:.4s;

}

.button:hover{

transform:
translateY(-5px);

}

@media(max-width:700px){

.container{

padding:45px 30px;

}

.code{

font-size:5rem;

}

h1{

font-size:2rem;

}

}

</style>

</head>

<body>

<div class="container">

<div class="code">

404

</div>

<h1>

The Path Became Hidden

</h1>

<p>

The page you followed could not be found. Even quiet roads sometimes disappear from view.

</p>

<div class="quote">

Silence does not mean the journey has ended.

Sometimes another path is waiting.

</div>

<a
href="index.html"
class="button">

Return Home

</a>

</div>

</body>

</html>
